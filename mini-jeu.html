<!DOCTYPE html> <html lang=fr>

<html>
  <head>
    <meta charset="utf-8">
    <link href="CSS/mini_jeu.css" rel="stylesheet">
    <link href="CSS/weather.css" rel="stylesheet">
    <link href="CSS/grid.css" rel="stylesheet">
    <link href="CSS/ui.css" rel="stylesheet">
    <link href="CSS/character.css" rel="stylesheet">
    
    
        <script type="module" src="./JAVASCRIPT/main.js"></script>

    <Title>Onizia Gaming></Title>
    
  </head>
  

  <body>
    <div id="hiddenGame" class="hiddenGame">
      <div class="textHiddenGame"></div>
    </div>

    <div id="debugWindow" class="debugWindow">
      <div class="debugText">Debug</div>
      <button id="debugButton" class="buttonBase">Debug</button>
    </div>
    
    <div id="containerVictory" class="containerVictory">
      <div class="textVictory"> Le gagnant est TRICHEUR ! </div>       
      <div class="containerButtonVictory">
        <button id="buttonRestart" class="buttonBase">Restart</button>
        <button id="buttonQuit" class="buttonBase">Quit</button>
      </div>            
    </div>

    <div class="game-container">    
      <div id="gridTile" class="gridTile"></div>
    
      <div id="character0" class="character">
        <div class="animEffect"></div>
        <div class="containerTarget"></div>         
      </div>
    
      <div id="character1" class="character">
        <div class="animEffect"></div>
        <div class="containerTarget"></div>          
      </div>

      <div id="character2" class="character">
        <div class="animEffect"></div>
        <div class="containerTarget"></div>        
      </div>

      <div id="character3" class="character">
        <div class="animEffect"></div>
        <div class="containerTarget"></div>         
      </div>

      <div id="elemWeather"></div>
    </div>
      
    <div class="containerUI">
      
      <div class="contInfoPlayer">
        <div class="elemCharacterInfoPlayer"></div>
        <div class="elemTextInfoPlayer"></div>
      </div>

      <div id="logFight" class="logFight"></div>

      <div class="containerAction">
        <button id="buttonMove" class="buttonBase">Move</button>
        <button id="buttonPass" class="buttonBase">Pass</button>
      </div>

      <div class="containerHand">
        <div id="tileHandSlot0" class="tileHand"></div>
        <div id="tileHandSlot1" class="tileHand"></div>
        <div id="tileHandSlot2" class="tileHand"></div>
        <!--<div id="tileHandSlot3" class="tileHand"></div>
        <div id="tileHandSlot4" class="tileHand"></div> -->
      </div>
        
    </div>
      
  </body>
</html>
