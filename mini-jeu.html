<!DOCTYPE html> <html lang=fr>

<html>
  <head>
    <meta charset="utf-8">
    <link href="CSS/mini_jeu.css" rel="stylesheet">
    <link href="CSS/animation.css" rel="stylesheet">
    <link href="CSS/grid.css" rel="stylesheet">
    <link href="CSS/ui.css" rel="stylesheet">
    
    
        <script type="module" src="JAVASCRIPT/main.js"></script>

    <Title>Onizia Gaming></Title>
    
  </head>
  

  <body>

      <div id="debugWindow">
        <div id="debugText">DEBUG WINDOW</div>
        <button id="debugButton">Debug</button>
      </div>

      <div id="victoryPlayer" class="contenairVictoryPlayer">
        <div id="textVictory"> Le gagnant est TRICHEUR ! </div>
        
        <div class="contenairButtonVictory">
          <button id="buttonRestart">Restart</button>
          <button id="buttonQuit">Quit</button>
        </div>
            
      </div>

      <div class="game-container">
        
        <div id="gridTile" class="gridTile"></div>
    
        <div id="character0" class="character">
          <div id="animEffect0" class="animEffect"></div>
        </div>
    
        <div id="character1" class="character">
          <div id="animEffect1" class="animEffect"></div>
        </div>
        
      </div>
    
      <!-- <div id="animEffectProject0"></div> -->
      
      <div class="containerUI">

        <div class="containerInfoPlayer">
          <div class="containerInfoPlayerLeft">
            <div class="infoPlayerLeftCharacter"></div>
            <div id="infoPlayerLeftText"></div>     
          </div>
           
          <div class="containerInfoPlayerRight">
            <div id="infoPlayerRightText"></div> 
            <div class="infoPlayerRightCharacter"></div>                 
          </div>
        </div>

      <div id="logFight"></div>

      <div class="contenairAction">
        <button id="buttonMove" class="buttonAction">Move</button>
        <button id="buttonEnd" class="buttonAction">Pass</button>
      </div>

      <div class="contenairHand">
        <div id="tileHandSlot0" class="tileHand"></div>
        <div id="tileHandSlot1" class="tileHand"></div>
        <div id="tileHandSlot2" class="tileHand"></div>
        <!--<div id="tileHandSlot3" class="tileHand"></div>
        <div id="tileHandSlot4" class="tileHand"></div> -->
      </div>
        
    </div>
      
  </body>
</html>
